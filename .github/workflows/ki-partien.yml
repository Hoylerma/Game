# KI-Partien (Meilenstein M12, Schritt b2; docs/technik/ki.md Abschnitte 7 und 10): 100 Partien 1848–1871
# ohne Spieler mit der KI der Staaten gegen data/common/kiziele_voelkerfruehling.chron, vier gleichzeitig.
# Abnahme M12: keine Abstürze, Einigung und Form der Einigung in ihren Korridoren. Läuft manuell und
# wöchentlich; der Bericht steht in der Zusammenfassung und als Artefakt.
#
# Lokal: ./build/release/cli/uhrwerk-cli ki --szenario voelkerfruehling --seeds 100 --parallel 4

name: KI-Partien

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 8 * *" # am 8. jedes Monats um 3:17 UTC (seit dem 18.11.2026, vorher wöchentlich)

permissions:
  contents: read

concurrency:
  group: ki-partien-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ki-partien:
    name: 100 KI-Partien 1848–1871
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Quelltext auschecken
        uses: actions/checkout@v4

      - name: Ninja installieren (falls nötig)
        run: |
          if ! command -v ninja > /dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ninja-build
          fi

      - name: Bauen (Preset release)
        run: |
          cmake --preset release
          cmake --build --preset release --target uhrwerk-cli

      - name: KI-Labor (100 Partien)
        run: |
          status=0
          ./build/release/cli/uhrwerk-cli ki --daten data --szenario voelkerfruehling --seeds 100 --parallel 4 \
            > "$RUNNER_TEMP/ki_partien.txt" 2>&1 || status=$?
          cp "$RUNNER_TEMP/ki_partien.txt" ki_partien.txt
          {
            echo "### 100 KI-Partien 1848–1871"
            echo
            echo '```'
            cat "$RUNNER_TEMP/ki_partien.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Bericht als Artefakt
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ki-partien
          path: ki_partien.txt
          if-no-files-found: warn
