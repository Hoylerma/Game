# Kontinuierliche Integration für EINIGKEIT.
#
# Jobs:
#   Kern (Linux)        GCC und Clang: Build mit Warnungen als Fehler, Tests, Prüfsummen nach 100 Jahren
#                       und des Lasttests, Prüfwert eines Spielstands nach 100 Jahren (seit M6)
#   Kern (Windows)      MSVC mit denselben Presets: Portabilität des Kerns
#   Determinismus       vergleicht die Prüfsummen und den Prüfwert des Spielstands von GCC, Clang und MSVC
#                       (müssen bitgleich sein: jede Plattform liest die Spielstände der anderen)
#   Lasttest            Release-Build, 500.000 Bevölkerungsblöcke, Zeit je Spieljahr (seit M4), Größe
#                       sowie Schreib- und Ladezeit des Spielstands (seit M6)
#   Formatierung        clang-format 18 über core/, cli/, tests/, bridge/
#   Python-Werkzeuge    Tests von Archivar, Kartengenerator und Geodaten (mit numpy, ohne Netz);
#                       sind data/history/ und data/karte/ aktuell?
#   Godot               GDExtension bauen, Einheiten-, Rauch- und Klicktest headless,
#                       Screenshots der Hauptszene als Artefakt
#
# Lokal nachstellen: siehe README.md, Abschnitt „Entwicklung“.

name: Prüfungen

on:
  push:
  pull_request:
  workflow_dispatch:

# Minimale Rechte: Die Jobs lesen nur den Quelltext.
permissions:
  contents: read

# Ein neuer Lauf auf demselben Branch (bzw. Pull Request) bricht ältere Läufe ab.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Jahre für den plattformübergreifenden Prüfsummenvergleich.
  PRUEFSUMME_JAHRE: 100
  PRUEFSUMME_JAHRE_1848: 2 # Lesezeichen 1848 (seit M7): rund 2 s je Spieljahr im Debug-Build
  # Lasttest für den Prüfsummenvergleich (im Debug-Build, daher klein).
  LASTTEST_BLOECKE: 50000
  LASTTEST_JAHRE: 2

jobs:
  kern-linux:
    name: Kern (Linux, ${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cxx: g++
          - compiler: clang
            cxx: clang++
    steps:
      - name: Quelltext auschecken
        uses: actions/checkout@v4

      - name: Ninja installieren (falls nötig)
        run: |
          if ! command -v ninja > /dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ninja-build
          fi
          ninja --version

      - name: Werkzeuge anzeigen
        run: |
          cmake --version
          ${{ matrix.cxx }} --version

      - name: Konfigurieren (Preset dev)
        run: cmake --preset dev -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}

      - name: Bauen
        run: cmake --build --preset dev

      - name: Testen
        run: ctest --preset dev

      - name: Prüfsummen festhalten (${{ env.PRUEFSUMME_JAHRE }} Jahre, Lasttest)
        run: |
          ./build/dev/cli/uhrwerk-cli lauf --daten data --jahre "$PRUEFSUMME_JAHRE" --speichern "$RUNNER_TEMP/lauf.einigkeit" \
            | tee "$RUNNER_TEMP/lauf.txt"
          summe=$(tr -d '\r' < "$RUNNER_TEMP/lauf.txt" | grep -E 'summe: [0-9a-f]{16}$' | tail -n 1 | grep -oE '[0-9a-f]{16}$' || true)
          if [ -z "$summe" ]; then
            echo "::error::Keine Prüfsumme in der Ausgabe von uhrwerk-cli gefunden."
            exit 1
          fi
          ./build/dev/cli/uhrwerk-cli lauf --daten data --szenario voelkerfruehling --jahre "$PRUEFSUMME_JAHRE_1848" \
            | tee "$RUNNER_TEMP/lauf1848.txt"
          summe1848=$(tr -d '\r' < "$RUNNER_TEMP/lauf1848.txt" | grep -E 'summe: [0-9a-f]{16}$' | tail -n 1 | grep -oE '[0-9a-f]{16}$' || true)
          if [ -z "$summe1848" ]; then
            echo "::error::Keine Prüfsumme im Lauf des Lesezeichens 1848 gefunden."
            exit 1
          fi
          ./build/dev/cli/uhrwerk-cli lasttest --daten data --bloecke "$LASTTEST_BLOECKE" --jahre "$LASTTEST_JAHRE" \
            | tee "$RUNNER_TEMP/lasttest.txt"
          last=$(tr -d '\r' < "$RUNNER_TEMP/lasttest.txt" | grep -E 'summe: [0-9a-f]{16}$' | tail -n 1 | grep -oE '[0-9a-f]{16}$' || true)
          if [ -z "$last" ]; then
            echo "::error::Keine Prüfsumme in der Ausgabe des Lasttests gefunden."
            exit 1
          fi
          wert=$(tr -d '\r' < "$RUNNER_TEMP/lauf.txt" | grep -E '^Prüfwert: +[0-9a-f]{16}' | grep -oE '[0-9a-f]{16}' | head -n 1 || true)
          if [ -z "$wert" ]; then
            echo "::error::Kein Prüfwert des Spielstands in der Ausgabe von uhrwerk-cli gefunden."
            exit 1
          fi
          mkdir -p pruefsumme
          printf 'lauf %s\nlauf1848 %s\nlasttest %s\nspielstand %s\n' "$summe" "$summe1848" "$last" "$wert" > "pruefsumme/linux-${{ matrix.compiler }}.txt"
          echo "Prüfsummen (Linux, ${{ matrix.compiler }}): lauf \`$summe\`, 1848 \`$summe1848\`, lasttest \`$last\`, Spielstand \`$wert\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Prüfsumme hochladen
        uses: actions/upload-artifact@v4
        with:
          name: pruefsumme-linux-${{ matrix.compiler }}
          path: pruefsumme/
          if-no-files-found: error
          retention-days: 7

  kern-windows:
    name: Kern (Windows, MSVC)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Quelltext auschecken
        uses: actions/checkout@v4

      - name: MSVC-Umgebung einrichten
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # CMake, Ninja und cl laufen in PowerShell (Standard unter Windows): In Git Bash
      # verdeckt /usr/bin/link den Linker link.exe von MSVC.
      - name: Werkzeuge anzeigen
        run: |
          # Ninja bringt Visual Studio mit (msvc-dev-cmd legt es in den Pfad); sonst nachinstallieren.
          # Die Programme von Chocolatey liegen auf den Runnern bereits im Pfad.
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            Write-Output "Ninja nicht im Pfad – Installation über Chocolatey."
            choco install ninja --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          cmake --version
          ninja --version
          Get-Command cl | Select-Object -ExpandProperty Source

      - name: Konfigurieren (Preset dev)
        run: cmake --preset dev -DCMAKE_CXX_COMPILER=cl

      - name: Bauen
        run: cmake --build --preset dev

      - name: Testen
        run: ctest --preset dev

      - name: Prüfsummen festhalten (${{ env.PRUEFSUMME_JAHRE }} Jahre, Lasttest)
        shell: bash
        run: |
          ./build/dev/cli/uhrwerk-cli.exe lauf --daten data --jahre "$PRUEFSUMME_JAHRE" --speichern "$RUNNER_TEMP/lauf.einigkeit" \
            | tee "$RUNNER_TEMP/lauf.txt"
          summe=$(tr -d '\r' < "$RUNNER_TEMP/lauf.txt" | grep -E 'summe: [0-9a-f]{16}$' | tail -n 1 | grep -oE '[0-9a-f]{16}$' || true)
          if [ -z "$summe" ]; then
            echo "::error::Keine Prüfsumme in der Ausgabe von uhrwerk-cli gefunden."
            exit 1
          fi
          ./build/dev/cli/uhrwerk-cli.exe lauf --daten data --szenario voelkerfruehling --jahre "$PRUEFSUMME_JAHRE_1848" \
            | tee "$RUNNER_TEMP/lauf1848.txt"
          summe1848=$(tr -d '\r' < "$RUNNER_TEMP/lauf1848.txt" | grep -E 'summe: [0-9a-f]{16}$' | tail -n 1 | grep -oE '[0-9a-f]{16}$' || true)
          if [ -z "$summe1848" ]; then
            echo "::error::Keine Prüfsumme im Lauf des Lesezeichens 1848 gefunden."
            exit 1
          fi
          ./build/dev/cli/uhrwerk-cli.exe lasttest --daten data --bloecke "$LASTTEST_BLOECKE" --jahre "$LASTTEST_JAHRE" \
            | tee "$RUNNER_TEMP/lasttest.txt"
          last=$(tr -d '\r' < "$RUNNER_TEMP/lasttest.txt" | grep -E 'summe: [0-9a-f]{16}$' | tail -n 1 | grep -oE '[0-9a-f]{16}$' || true)
          if [ -z "$last" ]; then
            echo "::error::Keine Prüfsumme in der Ausgabe des Lasttests gefunden."
            exit 1
          fi
          wert=$(tr -d '\r' < "$RUNNER_TEMP/lauf.txt" | grep -E '^Prüfwert: +[0-9a-f]{16}' | grep -oE '[0-9a-f]{16}' | head -n 1 || true)
          if [ -z "$wert" ]; then
            echo "::error::Kein Prüfwert des Spielstands in der Ausgabe von uhrwerk-cli gefunden."
            exit 1
          fi
          mkdir -p pruefsumme
          printf 'lauf %s\nlauf1848 %s\nlasttest %s\nspielstand %s\n' "$summe" "$summe1848" "$last" "$wert" > pruefsumme/windows-msvc.txt
          echo "Prüfsummen (Windows, MSVC): lauf \`$summe\`, 1848 \`$summe1848\`, lasttest \`$last\`, Spielstand \`$wert\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Prüfsumme hochladen
        uses: actions/upload-artifact@v4
        with:
          name: pruefsumme-windows-msvc
          path: pruefsumme/
          if-no-files-found: error
          retention-days: 7

  determinismus:
    name: Determinismus (GCC, Clang, MSVC)
    needs: [kern-linux, kern-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Prüfsummen herunterladen
        uses: actions/download-artifact@v4
        with:
          pattern: pruefsumme-*
          path: pruefsummen
          merge-multiple: true

      - name: Prüfsummen vergleichen
        run: |
          shopt -s nullglob
          dateien=(pruefsummen/*.txt)
          {
            echo "### Prüfsummen ($PRUEFSUMME_JAHRE Jahre mit data/; Lasttest $LASTTEST_BLOECKE Blöcke, $LASTTEST_JAHRE Jahre)"
            echo
            echo "Spielstand: Prüfwert der Nutzdaten des Spielstands nach $PRUEFSUMME_JAHRE Jahren."
            echo
            echo "| Plattform | lauf | 1848 ($PRUEFSUMME_JAHRE_1848 Jahre) | lasttest | Spielstand |"
            echo "|---|---|---|---|---|"
            for datei in "${dateien[@]}"; do
              lauf=$(grep '^lauf ' "$datei" | cut -d' ' -f2)
              lauf1848=$(grep '^lauf1848 ' "$datei" | cut -d' ' -f2)
              last=$(grep '^lasttest ' "$datei" | cut -d' ' -f2)
              wert=$(grep '^spielstand ' "$datei" | cut -d' ' -f2)
              echo "| $(basename "$datei" .txt) | \`$lauf\` | \`$lauf1848\` | \`$last\` | \`$wert\` |"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "${#dateien[@]}" -ne 3 ]; then
            echo "::error::Erwartet werden 3 Prüfsummendateien (GCC, Clang, MSVC), gefunden: ${#dateien[@]}."
            exit 1
          fi
          for datei in "${dateien[@]:1}"; do
            if ! cmp -s "${dateien[0]}" "$datei"; then
              echo "::error::Die Prüfsummen weichen ab – der Kern rechnet nicht auf allen Plattformen bitgleich."
              exit 1
            fi
          done
          echo "Alle Plattformen liefern dieselben Prüfsummen."

  lasttest:
    name: Lasttest (Linux, Release)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Quelltext auschecken
        uses: actions/checkout@v4

      - name: Ninja installieren (falls nötig)
        run: |
          if ! command -v ninja > /dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ninja-build
          fi
          nproc
          grep -m1 'model name' /proc/cpuinfo || true

      - name: Bauen (Preset release)
        run: |
          cmake --preset release
          cmake --build --preset release --target uhrwerk-cli

      # Abnahme M4 (docs/technik/bevoelkerung.md, Abschnitt 8): 500.000 Blöcke, Median höchstens
      # 2 s je Spieljahr. Die CI-Grenze von 3 s lässt Puffer für schwankende Runner; der Messwert
      # steht in der Zusammenfassung. Der Vergleichslauf mit einem Thread muss bitgleich sein.
      # Seit M6 zusätzlich Größe sowie Schreib- und Ladezeit des Spielstands.
      - name: Lasttest mit 500.000 Blöcken
        run: |
          set -o pipefail
          ./build/release/cli/uhrwerk-cli lasttest --daten data --bloecke 500000 --jahre 3 --vergleich 1 --grenze 3 \
            --speichern "$RUNNER_TEMP/lasttest.einigkeit" | tee "$RUNNER_TEMP/lasttest.txt"
          {
            echo "### Lasttest (Release, $(nproc) Kerne)"
            echo
            echo '```'
            cat "$RUNNER_TEMP/lasttest.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  balancing:
    name: Balancing (Linux, Release)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Quelltext auschecken
        uses: actions/checkout@v4

      - name: Ninja installieren (falls nötig)
        run: |
          if ! command -v ninja > /dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ninja-build
          fi

      - name: Bauen (Preset release)
        run: |
          cmake --preset release
          cmake --build --preset release --target uhrwerk-cli

      # Abnahme M5 (docs/technik/wirtschaft.md, Abschnitte 7 und 8): 16 Läufe über 100 Jahre ohne
      # Spielereingriff gegen die Zielwerte in data/common/zielwerte.chron; Exitcode 1 bei Verstoß.
      # Der Bericht steht auch bei Verstoß in der Zusammenfassung.
      - name: Balancing-Bericht (16 Seeds, 100 Jahre)
        run: |
          status=0
          ./build/release/cli/uhrwerk-cli bilanz --daten data --seeds 16 --jahre 100 \
            > "$RUNNER_TEMP/bilanz.txt" 2>&1 || status=$?
          cat "$RUNNER_TEMP/bilanz.txt"
          {
            echo "### Balancing-Bericht (16 Seeds, 100 Jahre)"
            echo
            echo '```'
            cat "$RUNNER_TEMP/bilanz.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # Lesezeichen 1848 (M7, docs/technik/lesezeichen_1848.md Abschnitt 8): eigene Zielwerte in
      # data/common/zielwerte_voelkerfruehling.chron; läuft auch, wenn der Bericht für 1648 scheitert.
      - name: Balancing-Bericht 1848 (8 Seeds, 30 Jahre)
        if: ${{ !cancelled() }}
        run: |
          status=0
          ./build/release/cli/uhrwerk-cli bilanz --daten data --szenario voelkerfruehling --seeds 8 --jahre 30 \
            > "$RUNNER_TEMP/bilanz_1848.txt" 2>&1 || status=$?
          cat "$RUNNER_TEMP/bilanz_1848.txt"
          {
            echo "### Balancing-Bericht 1848 (8 Seeds, 30 Jahre)"
            echo
            echo '```'
            cat "$RUNNER_TEMP/bilanz_1848.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # Wahllabor (M8, docs/technik/politik.md Abschnitt 7.8): Nationalversammlung 1848 und
      # Preußische Zweite Kammer 1849 gegen data/common/wahlziele_voelkerfruehling.chron, mit dem
      # Ergebnis je Wahlkreis der Nationalversammlung im Bericht.
      - name: Wahllabor 1848/49
        if: ${{ !cancelled() }}
        run: |
          status=0
          ./build/release/cli/uhrwerk-cli wahl --daten data --szenario voelkerfruehling --seeds 16 --wahlkreise \
            > "$RUNNER_TEMP/wahl_1848.txt" 2>&1 || status=$?
          # Preußen 1849 (Dreiklassen): Plausibilität, 16 Monate je Seed
          ./build/release/cli/uhrwerk-cli wahl --daten data --szenario voelkerfruehling --seeds 8 \
            --parlament pr_abgeordnetenhaus >> "$RUNNER_TEMP/wahl_1848.txt" 2>&1 || status=$?
          sed '/^Ergebnis je Wahlkreis/,/^$/d' "$RUNNER_TEMP/wahl_1848.txt"
          {
            echo "### Wahllabor 1848/49"
            echo
            echo '```'
            cat "$RUNNER_TEMP/wahl_1848.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # Zolllabor (M9, docs/technik/diplomatie.md Abschnitt 3.6): Beitritte Hannovers und
      # Mecklenburg-Schwerins zum Zollverein und der Zollanteil der Unionen gegen
      # data/common/zollziele_voelkerfruehling.chron.
      - name: Zolllabor 1848
        if: ${{ !cancelled() }}
        run: |
          status=0
          ./build/release/cli/uhrwerk-cli zoll --daten data --szenario voelkerfruehling --seeds 8 \
            > "$RUNNER_TEMP/zoll_1848.txt" 2>&1 || status=$?
          cat "$RUNNER_TEMP/zoll_1848.txt"
          {
            echo "### Zolllabor 1848"
            echo
            echo '```'
            cat "$RUNNER_TEMP/zoll_1848.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  formatierung:
    name: Formatierung
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Quelltext auschecken
        uses: actions/checkout@v4

      - name: clang-format 18 bereitstellen
        run: |
          if ! command -v clang-format-18 > /dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends clang-format-18
          fi
          clang-format-18 --version

      - name: C++-Quelltext prüfen
        run: |
          mapfile -d '' dateien < <(git ls-files -z -- \
            'core/*.cpp' 'core/*.hpp' 'core/*.h' \
            'cli/*.cpp' 'cli/*.hpp' 'cli/*.h' \
            'tests/*.cpp' 'tests/*.hpp' 'tests/*.h' \
            'bridge/*.cpp' 'bridge/*.hpp' 'bridge/*.h')
          if [ "${#dateien[@]}" -eq 0 ]; then
            echo "::error::Keine C++-Dateien gefunden."
            exit 1
          fi
          echo "Prüfe ${#dateien[@]} Dateien mit clang-format 18 …"
          if ! clang-format-18 --dry-run --Werror "${dateien[@]}"; then
            echo "::error::Nicht formatierte Dateien – bitte mit 'clang-format -i <datei>' (Version 18) formatieren."
            exit 1
          fi
          echo "Alle Dateien sind korrekt formatiert."

  kartengenerator:
    name: Python-Werkzeuge (Python ${{ matrix.python }}, numpy ${{ matrix.numpy }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Älteste und neueste unterstützte Version: Karte und Historie müssen mit beiden gleich
        # entstehen. numpy ist je Version fest gepinnt (numpy 2.3 und neuer laufen erst ab
        # Python 3.11); mit genau diesen Paaren ist die Karte auch lokal geprüft.
        include:
          - python: '3.10'
            numpy: '2.2.6'
          - python: '3.13'
            numpy: '2.5.3'
    steps:
      - name: Quelltext auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # Kartengenerator und Geodaten rechnen mit numpy; der Archivar braucht nur die
      # Standardbibliothek.
      - name: numpy ${{ matrix.numpy }} installieren
        env:
          NUMPY_VERSION: ${{ matrix.numpy }}
        run: |
          python3 -m pip install --disable-pip-version-check --no-input "numpy==${NUMPY_VERSION}"
          python3 -c 'import sys, numpy; print("Python", sys.version.split()[0], "· numpy", numpy.__version__)'

      - name: Tests des Archivars
        run: python3 -m unittest discover -s tools/archivar -v

      - name: Historie aktuell? (data/history/ aus data/tabellen/)
        run: python3 tools/archivar/archivar.py --pruefen

      - name: Tests des Kartengenerators
        run: python3 -m unittest discover -s tools/kartengenerator -v

      - name: Karte aktuell? (data/karte/provinzen.png, fluesse.png, definition.csv)
        run: python3 tools/kartengenerator/kartengenerator.py --pruefen --zeiten

      # Ohne Netz und ohne Rohdaten: Die Tests nutzen tools/geodaten/testdaten/ und die
      # eingecheckten Dateien. 'geodaten.py pruefen' und 'orte.py --pruefen' brauchen den
      # Zwischenspeicher build/geodaten-cache/ und laufen deshalb nur lokal.
      - name: Tests der Geodaten (tools/geodaten)
        run: python3 -m unittest discover -s tools/geodaten -v

      # Seit M8: Die Wahlkreise sind aus den Tabellen berechnet (ohne Zwischenspeicher).
      - name: Wahlkreise aktuell? (data/tabellen/wahlkreise.csv)
        run: python3 tools/geodaten/wahlkreise_1848.py --pruefen

  godot:
    name: Godot (Brücke, Tests, Screenshots)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Mit ausdrücklich gesetzter Shell läuft bash mit 'pipefail': Bricht Godot in
    # 'godot … | tee log' mit einem Fehlercode ab, schlägt auch der Schritt fehl.
    defaults:
      run:
        shell: bash
    env:
      GODOT_VERSION: 4.4.1-stable
      GODOT_BIN: tools/godot/Godot_v4.4.1-stable_linux.x86_64
      # SHA-512 von Godot_v4.4.1-stable_linux.x86_64.zip (SHA512-SUMS.txt des Releases).
      GODOT_SHA512: ef4e76880a514257175544952c61191106fdef3095b909bafed9fcbeb230c3e5533920a0f3012882dd4bbde83028a67549825794e2d2c3cf76eba7918b71370e
    steps:
      - name: Quelltext mit Submodulen auschecken
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Pakete installieren (Ninja, Xvfb, Mesa)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build xvfb xauth \
            libgl1 libgl1-mesa-dri libglx-mesa0 \
            libx11-6 libxcursor1 libxext6 libxi6 libxinerama1 libxrandr2 libxrender1 \
            libxkbcommon0 libfontconfig1

      - name: Cache-Schlüssel für godot-cpp ermitteln
        id: godotcpp
        run: |
          echo "commit=$(git rev-parse HEAD:third_party/godot-cpp)" >> "$GITHUB_OUTPUT"
          echo "compiler=gcc-$(g++ -dumpfullversion)" >> "$GITHUB_OUTPUT"

      # Gecacht werden die Objektdateien von godot-cpp samt Ninja-Protokoll (.ninja_log,
      # .ninja_deps); ohne das Protokoll würde Ninja alles neu übersetzen.
      - name: godot-cpp-Build aus dem Cache holen
        id: godotcpp-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/bridge/godot-cpp
            build/bridge/bin
            build/bridge/.ninja_log
            build/bridge/.ninja_deps
          key: godot-cpp-ubuntu-24.04-${{ steps.godotcpp.outputs.compiler }}-${{ steps.godotcpp.outputs.commit }}-${{ hashFiles('CMakePresets.json', 'CMakeLists.txt', 'bridge/CMakeLists.txt') }}
          restore-keys: |
            godot-cpp-ubuntu-24.04-${{ steps.godotcpp.outputs.compiler }}-${{ steps.godotcpp.outputs.commit }}-

      # Der Checkout setzt die Änderungszeit aller Dateien auf „jetzt“; die Objektdateien
      # aus dem Cache wären damit veraltet. Das Submodul ist durch den Commit im
      # Cache-Schlüssel festgelegt, daher bekommen seine Dateien eine feste alte Zeit.
      - name: Zeitstempel von godot-cpp festsetzen
        run: find third_party/godot-cpp -exec touch -h -d '2000-01-01 00:00:00 UTC' {} +

      - name: Brücke konfigurieren (Preset bridge)
        run: cmake --preset bridge -DCMAKE_CXX_COMPILER=g++

      - name: godot-cpp bauen
        run: cmake --build --preset bridge --target godot-cpp

      # Sofort sichern (nicht erst am Jobende), damit ein späterer Fehler im Rauchtest
      # nicht jedes Mal einen vollständigen Neubau von godot-cpp nach sich zieht.
      - name: godot-cpp-Build im Cache ablegen
        if: steps.godotcpp-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build/bridge/godot-cpp
            build/bridge/bin
            build/bridge/.ninja_log
            build/bridge/.ninja_deps
          key: ${{ steps.godotcpp-cache.outputs.cache-primary-key }}

      - name: Brücke bauen
        run: |
          cmake --build --preset bridge
          ls -l game/bin/

      - name: Godot aus dem Cache holen
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: tools/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Godot ${{ env.GODOT_VERSION }} herunterladen
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          zip="$RUNNER_TEMP/godot.zip"
          curl -fsSL --retry 3 --retry-delay 5 -o "$zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          echo "${GODOT_SHA512}  $zip" | sha512sum -c -
          mkdir -p tools/godot
          unzip -o "$zip" -d tools/godot
          chmod +x "$GODOT_BIN"

      - name: Godot-Version
        run: '"$GODOT_BIN" --version'

      - name: Projekt importieren (headless)
        run: |
          "$GODOT_BIN" --headless --path game --import 2>&1 | tee "$RUNNER_TEMP/import.log"
          if grep -E "SCRIPT ERROR|Parse Error" "$RUNNER_TEMP/import.log"; then
            echo "::error::Skriptfehler beim Import des Godot-Projekts."
            exit 1
          fi

      # Ein Skriptfehler bricht im --script-Modus nur die betroffene Funktion ab; deshalb wird
      # jedes Protokoll zusätzlich auf SCRIPT ERROR und Parse Error geprüft.
      - name: Einheitentests der Godot-Seite (game/tests/unit_test.gd)
        run: |
          "$GODOT_BIN" --headless --path game --script res://tests/unit_test.gd 2>&1 | tee "$RUNNER_TEMP/unit.log"
          grep -q "UNIT OK" "$RUNNER_TEMP/unit.log"
          if grep -E "SCRIPT ERROR|Parse Error" "$RUNNER_TEMP/unit.log"; then
            echo "::error::Skriptfehler in den Einheitentests der Godot-Seite."
            exit 1
          fi

      - name: Rauchtest (game/tests/smoke_test.gd)
        run: |
          "$GODOT_BIN" --headless --path game --script res://tests/smoke_test.gd 2>&1 | tee "$RUNNER_TEMP/smoke.log"
          grep -q "SMOKE OK" "$RUNNER_TEMP/smoke.log"
          if grep -E "SCRIPT ERROR|Parse Error" "$RUNNER_TEMP/smoke.log"; then
            echo "::error::Skriptfehler im Rauchtest."
            exit 1
          fi

      # Abnahme M3: Jeder Ort der Karte wird bei drei Zoomstufen richtig erkannt.
      - name: Klicktest (game/tests/klick_test.gd)
        run: |
          "$GODOT_BIN" --headless --path game --script res://tests/klick_test.gd 2>&1 | tee "$RUNNER_TEMP/klick.log"
          grep -q "KLICK OK" "$RUNNER_TEMP/klick.log"
          if grep -E "SCRIPT ERROR|Parse Error" "$RUNNER_TEMP/klick.log"; then
            echo "::error::Skriptfehler im Klicktest."
            exit 1
          fi
          grep "KLICK OK" "$RUNNER_TEMP/klick.log" | sed 's/^/Klicktest: /' >> "$GITHUB_STEP_SUMMARY"

      - name: Screenshots der Hauptszene (Xvfb, OpenGL 3)
        run: |
          mkdir -p artefakte
          # Übersicht im Kartenmodus „Politisch“ mit Ortsinfo Berlin-Cölln
          xvfb-run -a -s "-screen 0 1600x900x24" \
            "$GODOT_BIN" --path game --rendering-driver opengl3 --audio-driver Dummy \
            -- --screenshot="$PWD/artefakte/einigkeit.png" --tage=60 --kartenmodus=0 --ort=berlin_coelln \
            2>&1 | tee "$RUNNER_TEMP/screenshot.log"
          # Mittlere Zoomstufe im Kartenmodus „Kreise“ (Kreisnamen, Ort ohne Daten)
          xvfb-run -a -s "-screen 0 1600x900x24" \
            "$GODOT_BIN" --path game --rendering-driver opengl3 --audio-driver Dummy \
            -- --screenshot="$PWD/artefakte/einigkeit_kreise.png" --tage=60 --kartenmodus=5 --ort=nuernberg --zoom=4 \
            2>&1 | tee -a "$RUNNER_TEMP/screenshot.log"
          # Kartenmodus „Märkte“ mit Ortsinfo Leipzig und Haushaltsfenster (seit M5)
          xvfb-run -a -s "-screen 0 1600x900x24" \
            "$GODOT_BIN" --path game --rendering-driver opengl3 --audio-driver Dummy \
            -- --screenshot="$PWD/artefakte/einigkeit_wirtschaft.png" --tage=400 --kartenmodus=9 --ort=leipzig --haushalt \
            2>&1 | tee -a "$RUNNER_TEMP/screenshot.log"
          # Spielmenü mit Speichern und Laden (seit M6)
          xvfb-run -a -s "-screen 0 1600x900x24" \
            "$GODOT_BIN" --path game --rendering-driver opengl3 --audio-driver Dummy \
            -- --screenshot="$PWD/artefakte/einigkeit_spielmenue.png" --tage=200 --spielmenue \
            2>&1 | tee -a "$RUNNER_TEMP/screenshot.log"
          # Lesezeichen 1848 im Kartenmodus „Verwaltung“ mit Ortsinfo Leipzig (seit M7)
          xvfb-run -a -s "-screen 0 1600x900x24" \
            "$GODOT_BIN" --path game --rendering-driver opengl3 --audio-driver Dummy \
            -- --screenshot="$PWD/artefakte/einigkeit_1848.png" --szenario=voelkerfruehling --tage=30 --kartenmodus=10 --ort=leipzig \
            2>&1 | tee -a "$RUNNER_TEMP/screenshot.log"
          # Wahlabend der Nationalversammlung am 1. Mai 1848 mit Ortsinfo Mannheim (seit M8)
          xvfb-run -a -s "-screen 0 1600x900x24" \
            "$GODOT_BIN" --path game --rendering-driver opengl3 --audio-driver Dummy \
            -- --screenshot="$PWD/artefakte/einigkeit_wahlabend.png" --szenario=voelkerfruehling --tage=62 --wahlabend --ort=mannheim \
            2>&1 | tee -a "$RUNNER_TEMP/screenshot.log"
          # Parteienmodus: Liberale im Wahlkampf, Ortsinfo Mannheim mit Stimmungsbericht (seit M8)
          xvfb-run -a -s "-screen 0 1600x900x24" \
            "$GODOT_BIN" --path game --rendering-driver opengl3 --audio-driver Dummy \
            -- --screenshot="$PWD/artefakte/einigkeit_partei.png" --szenario=voelkerfruehling --tage=20 --partei=liberale --kartenmodus=12 --ort=mannheim \
            2>&1 | tee -a "$RUNNER_TEMP/screenshot.log"
          # Zollgebiete 1848 mit dem Fenster „Zollunion“ Hannovers und Ortsinfo Hamburg (seit M9)
          xvfb-run -a -s "-screen 0 1600x900x24" \
            "$GODOT_BIN" --path game --rendering-driver opengl3 --audio-driver Dummy \
            -- --screenshot="$PWD/artefakte/einigkeit_zoll.png" --szenario=voelkerfruehling --staat=HAN --tage=31 --kartenmodus=13 --zollunion --ort=hamburg \
            2>&1 | tee -a "$RUNNER_TEMP/screenshot.log"
          if grep -E "SCRIPT ERROR|Parse Error|SHADER ERROR" "$RUNNER_TEMP/screenshot.log"; then
            echo "::error::Skript- oder Shaderfehler bei den Screenshots."
            exit 1
          fi

      - name: Screenshots hochladen
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-hauptszene
          path: artefakte/
          if-no-files-found: warn
          retention-days: 14
