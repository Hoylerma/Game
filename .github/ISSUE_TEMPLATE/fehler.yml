name: Fehler melden
description: Ein technischer Fehler im Spiel, im Kern oder in den Werkzeugen
labels: ["fehler"]
body:
  - type: textarea
    id: beschreibung
    attributes:
      label: Was ist passiert?
      description: Beschreibe den Fehler und was du stattdessen erwartet hast.
    validations:
      required: true
  - type: textarea
    id: schritte
    attributes:
      label: Schritte zum Nachstellen
      placeholder: |
        1. Lesezeichen 1648 starten
        2. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / Commit
  - type: dropdown
    id: bereich
    attributes:
      label: Bereich
      options: [Kern (Uhrwerk), Kommandozeile, Godot-Spiel, Daten, Werkzeuge, Sonstiges]
    validations:
      required: true
