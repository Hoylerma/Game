; Hinweise beim ersten Öffnen eines Fensters (seit M13b3, docs/technik/vertical_slice.md 5.4).
; Abschnitt = Knotenname des Fensters (bzw. Haushalt und Zollunion); titel und text, zwei, drei Sätze.

[CabinetWindow]
titel="Kabinett und Hof"
text="Herrscher und Minister mit ihren Werten und Eigenschaften. Ihre Neigungen prägen, wohin ein Staat strebt; wer ausscheidet, steht unten unter den früheren Amtsinhabern."

[LawsWindow]
titel="Gesetze"
text="Verfassung, Wahlrecht und die Gesetze des Staates. Jede Option nennt ihre Wirkung auf die Unruhe und die Gruppen dafür und dagegen; ändern lassen sich Gesetze über Ereignisse."

[GroupsWindow]
titel="Interessengruppen"
text="Adel, Bürgertum, Bauern, Arbeiter, Kirche, Militär: ihr Anteil, ihr Einfluss und ihre Zustimmung. Unzufriedene Gruppen treiben die Unruhe nach oben."

[ParliamentWindow]
titel="Parlament"
text="Das Halbrund der letzten Wahl nach Fraktionen, die nächste Wahl und die Abstimmungen. Oben wählen Sie das Parlament, etwa die Nationalversammlung oder eine Kammer."

[SocietyWindow]
titel="Gesellschaft"
text="Altersaufbau, Kulturen, Konfessionen und Berufe des Staates, dazu Geburten, Sterbefälle und Wanderung im Vorjahr."

[EconomyWindow]
titel="Wirtschaft"
text="Was der Staat erzeugt, was die Märkte kosten, welche Betriebe arbeiten. Die Steuern stellen Sie in der Staatsübersicht ein."

[ChronicleWindow]
titel="Chronik"
text="Alles, was geschehen ist, neueste Einträge zuerst. Filter und Suche helfen; ein Klick auf einen Eintrag mit Ort fährt die Karte dorthin."

[DiplomacyWindow]
titel="Diplomatie"
text="Links die Staaten mit Ihrer Beziehung zu ihnen, rechts die Handlungen: Gesandte, Bündnisse, Forderungen, Krieg. Der zweite Reiter zeigt die Bundesversammlung, der dritte die deutsche Frage."

[WarWindow]
titel="Militär und Krieg"
text="Laufende Kriege mit Kriegszielen, Kriegspunkten und Kriegsmüdigkeit. Hier bieten Sie Frieden an; Heere wählen Sie auf der Karte und schicken sie per Rechtsklick."

[JournalWindow]
titel="Journale"
text="Die großen Fragen der Zeit, Stufe für Stufe mit ihren Zielen. Ihr Ausgang entscheidet, wie die Geschichte am Ende über Sie urteilt."

[YearbookWindow]
titel="Statistisches Jahrbuch"
text="Jede Kennzahl und jede Dimension des Vermächtnisses Jahr für Jahr, mit bis zu drei Staaten zum Vergleich. Unter „Zeitungen“ stehen alle Titelseiten der Partie."

[LexiconWindow]
titel="Lexikon"
text="Begriffe der Epoche, kurz erklärt. Unterstrichene Wörter in den Tooltips führen hierher."

[EventWindow]
titel="Ereignisse"
text="Ein Ereignis hält die Zeit an, bis Sie einen Weg gewählt haben; jeder nennt seine Folgen. Der historische Kompass ◆ markiert, wie es wirklich kam."

[NewspaperWindow]
titel="Die Zeitung"
text="Wichtige Nachrichten erscheinen als Titelseite eines Blattes Ihrer Gegend, je nach Richtung anders erzählt. Ein Klick legt sie beiseite."

[ElectionNight]
titel="Wahlabend"
text="Die Ergebnisse laufen Wahlkreis um Wahlkreis ein, die Karte färbt sich mit. Schließen Sie den Abend, wenn alle Kreise gemeldet haben."

[VerdictWindow]
titel="Urteil der Geschichte"
text="Am Ende der Partie: der Ausgang der Journale, Ihr Vermächtnis und die Wendepunkte. Sie können weiterspielen oder die Chronik als HTML speichern."

[RecapWindow]
titel="Was ist passiert?"
text="Nach dem Laden die wichtigsten Nachrichten des letzten Jahres – zum Wiedereinfinden. Abschaltbar in den Einstellungen unter „Spiel“."

[Haushalt]
titel="Haushalt"
text="Einnahmen und Ausgaben im Einzelnen. Ein negativer Saldo macht Schulden; zu hohe Schulden enden im Staatsbankrott."

[Zollunion]
titel="Zollunion"
text="Wer einer Zollunion angehört, handelt ohne Zölle mit den anderen Mitgliedern. Beitritt und Austritt wirken erst mit dem nächsten Jahr."
